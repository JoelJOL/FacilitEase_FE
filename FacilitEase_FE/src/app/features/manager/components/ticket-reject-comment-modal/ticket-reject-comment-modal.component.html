<div class="modal-container" (click)="$event.stopPropagation()">
  <div class="modal-content">
    <div class="title-container">
      <h2 mat-dialog-title id="title">Reason for Rejection</h2>
    </div>
    <mat-dialog-content
      >Please specify the reason for the rejection of
      ticket.</mat-dialog-content
    >
    <div class="input-container">
      <mat-form-field>
        <input
          matInput
          id="comment"
          [(ngModel)]="comment"
          [formControl]="commentControl"
          required
        />
      </mat-form-field>
    </div>
    <mat-dialog-actions>
      <button
        id="btn-reject"
        (click)="onRejectClick()"
        [disabled]="commentControl.invalid"
      >
        Reject
      </button>
    </mat-dialog-actions>
  </div>
</div>
