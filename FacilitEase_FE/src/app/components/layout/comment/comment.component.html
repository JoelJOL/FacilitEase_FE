<div class="comment">
  <div class="comment-image-container">
    <img src="/assets/new.jpg" />
  </div>
  <div class="comment-right-part">
    <div class="comment-content">
      <div class="comment-author">{{ comment.employeeName }}</div>
      <div>{{ comment.updatedAt |date: 'short' }}</div>
      <span style="font-style: italic;" *ngIf="comment.createdAt!=comment.updatedAt">(Edited)</span>
    </div>
    <div class="comment-text" *ngIf="!isEditing()">{{ comment.text }}</div>
    <div class="comment-actions">
      <div *ngIf="canReply" class="comment-action" (click)="
            setActiveComment.emit({
              id: comment.id,
              type: activeCommentType.replying
            })
          ">
        Reply
      </div>
      <div *ngIf="canEdit" class="comment-action" (click)="
            setActiveComment.emit({
              id: comment.id,
              type: activeCommentType.editing
            })
          ">
        Edit
      </div>
      <!-- <div
          *ngIf="canDelete"
          class="comment-action"
          (click)="deleteComment.emit(comment.id)"
        >
          Delete
        </div> -->
    </div>
    <app-comment-form *ngIf="isEditing()" submitLabel="Update" [hasCancelButton]="true" [initialText]="comment.text"
      (handleSubmit)="
        updateComment.emit({ text: $event, commentId: comment.id })
      " (handleCancel)="setActiveComment.emit(null)"></app-comment-form>
    <app-comment-form *ngIf="isReplying()" submitLabel="Reply"
      (handleSubmit)="addComment.emit({ text: $event, parentId: comment.id })" [hasCancelButton]="true"
      (handleCancel)="setActiveComment.emit(null)"></app-comment-form>
    <div class="replies" *ngIf="comment.replies.length > 0">
      <!-- Recursive call to app-comment for each reply -->
      <app-comment *ngFor="let reply of comment.replies" [comment]="reply" [replies]="reply.replies"
        [activeComment]="activeComment" (setActiveComment)="setActiveComment.emit($event)"
        (updateComment)="updateComment.emit($event)" (addComment)="addComment.emit($event)" [parentId]="comment.id"
        [currentUserId]="currentUserId"></app-comment>
    </div>
  </div>
</div>
